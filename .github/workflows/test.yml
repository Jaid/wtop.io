name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v6.0.2
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: 1.4.2
    - name: install
      run: bun install --frozen-lockfile
    - name: unitAndDom
      run: bun run test
    - name: collector
      run: bun run test:collector
    - name: setupChrome
      id: chrome
      uses: browser-actions/setup-chrome@39ce663831f86d2ea36cbda0a8143709cdfcc410 # v2.2.0
      with:
        chrome-version: stable
        install-dependencies: true
    - name: productionBrowser
      env:
        BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
      run: bun run test:browser
